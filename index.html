<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather_movie_app</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200">
        <div class="max-w-md mx-auto px-6 py-3 flex items-center justify-between">
            <span class="font-semibold"> Weather & Movies </span>
            <div class="flex gap-2">
                <button class="tab-btn px-3 py-1.5 text-sm rounded-lg bg-blue-600 text-white" data-target="weather-section">Weather</button>
                <button class="tab-btn px-3 py-1.5 text-sm rounded-lg text-slate-600" data-target="movies-section">Movies</button>
            </div>
        </div>
    </nav>
    <main class="max-w-3xl mx-auto p-6">
        <section id="weather-section">
        <h1 class="text-2xl font-semibold text-center py-3">Weather</h1>
        <form id="weather-form" class="flex gap-2 mb-4">
            <input
            type="text" id="city-name" placeholder="Enter a city" class="flex-1 p-2.5 text-sm rounded-lgbg-white border-slate-300 focus:border-blue-500"
            >
            <button
            type="submit"
            class="px-3 py-1.5 text-sm rounded-lgbg-blue-600 text-white hover:bg-blue-500"
            >
            Search
        </button>
    </form>
    <p id="weather-status" class="text-sm text-slate-500 mb-4"></p>
    <div id="weather-result" class="hidden bg-white rounded-2xl border border-slate-200 p-6">
        <h2 id="w-city" class="text-xl font-semibold"></h2>
        <p class="mt-2 text-6xl font-bold"><span id="w-temp">°C</span></p>
        <p id="w-condition" class="mt-1" text-blue-600></p>
        <div class="mt-4 flex gap-8 text-sm text-slate-500">
            <p>humidity: <span id="w-humidity" class="text-slate-900"></span></p>
            <p>Wind: <span id="w-wind" class="text-slate-900"></span></p>
        </div>
    </div>


    </section>

    <section id="movies-section" class="hidden">
    <p>Movies coming soon.</p>
    </section>

    </main>
    <script src="app.js"></script>
</body>
</html>
