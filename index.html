<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather_movie_app</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="bg-sky-950 text-white min-h-screen">
    <main class="max-w-md mx-auto p-6">
        <h1 class="text-2xl font-semibold text-center py-3">Weather</h1>
        <form id="weather-form" class="flex gap-2 mb-4">
            <input
            type="text" id="city-name" placeholder="Enter a city" class="flex-1 p-2.5 text-sm rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-amber-400"
            >
            <button
            type="submit"
            class="px-3 py-1.5 text-sm rounded-lg bg-amber-400 text-slate-900 font-medium hover:bg-amber-300"
            >
            Search
        </button>
    </form>
    <p id="weather-status" class="text-sm text-slate-300 mb-4"></p>
    </main>
    <script src="app.js"></script>
</body>
</html>
